name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies for the parity check
        run: python -m pip install numpy
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run parity
      - run: npm run build
